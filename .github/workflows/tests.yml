name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Test MCP server (real Sentinel-2 data) and agent wiring (scripted fake LLM)
        run: |
          rm -rf outputs/mcp/cache   # no cached results: the pipeline runs for real
          pytest -q
